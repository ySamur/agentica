<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080f" />
    <meta name="description" content="Из разработчика — в оператора ИИ. Как Claude Code меняет работу программиста, какие навыки нужны теперь и путеводитель по переходу для участников." />
    <title>agentica — Код пишет Claude. Решения — ваши.</title>
    <style>
      /* Every page is dark; no white flash before the app mounts. */
      html { background: #07080f; color-scheme: dark; }
    </style>
    <script>
      // Same hint as the app: no stored Supabase session on / means the guest landing.
      try {
        if (location.pathname === '/' && !Object.keys(localStorage).some(key => /^sb-.+-auth-token$/.test(key))) {
          // The film's first frame is the landing's largest paint; fetch it before the app asks.
          const poster = document.createElement('link');
          poster.rel = 'preload';
          poster.as = 'image';
          poster.fetchPriority = 'high';
          poster.href = matchMedia('(max-aspect-ratio: 4/5)').matches ? '/frames/typing/mobile/f_001.webp' : '/frames/typing/desktop/f_001.webp';
          document.head.append(poster);
        }
      } catch {
        // Blocked storage: the app still loads the poster itself.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
